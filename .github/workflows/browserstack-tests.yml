name: Run Selenium Tests on BrowserStack

on:
  workflow_dispatch:
    inputs:
      test_case:
        description: "Specify the test case to run (or 'all' to run all)"
        required: true
        default: "all"

jobs:
  run-selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          TEST_CASE: ${{ github.event.inputs.test_case }}
        run: |
          echo "Test case input: $TEST_CASE"
          if [ "$TEST_CASE" = "all" ]; then
            echo "Running all tests..."
            node run-all-tests.js
          elif [ -f "testCases/$TEST_CASE.js" ]; then
            echo "Found file: testCases/$TEST_CASE.js"
            chmod +x testCases/$TEST_CASE.js
            node testCases/$TEST_CASE.js || echo "Execution of $TEST_CASE.js failed"
          else
            echo "Test case not found: $TEST_CASE"
            echo "Available test cases in testCases directory:"
            ls -l testCases/
            exit 1
          fi
