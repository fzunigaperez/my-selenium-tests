name: Run Selenium Tests on BrowserStack

on:
  workflow_dispatch:
    inputs:
      test_case:
        description: 'Nombre del test case a ejecutar (por ejemplo, C15 o C90)'
        required: false
        default: 'all'

  schedule:
    - cron: "00 20 * * *"

jobs:
  run-selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests on BrowserStack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          if [ "${{ github.event.inputs.test_case }}" = "all" ]; then
            node run-all-tests.js
          else
            echo "Running single test case: ${{ github.event.inputs.test_case }}"
            node testCases/${{ github.event.inputs.test_case }}.js
          fi
