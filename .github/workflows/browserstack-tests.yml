name: Run Selenium Tests on BrowserStack

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      test_case:
        description: "Specify the test case(s) to run (e.g., C90, C15 or all for all test cases)"
        required: true
        default: "all"
      environment:
        description: "Specify the environment (e.g., PROD, STG, DEV)"
        required: false
        default: "" # Default to an empty string if not specified

jobs:
  run-selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Set default environments
        id: set-defaults
        run: |
          # Define default environments for services
          DEFAULT_ENV="STG"               # General default
          EMMA_DEFAULT_ENV="STG"         # EMMA's default environment
          UMS_DEFAULT_ENV="PROD"         # User Management Service default
          DMS_DEFAULT_ENV="PROD"         # Device Management Service default
          CRS_DEFAULT_ENV="DEV"         # Charger Repay Service default

          # Use input environment if specified; otherwise, use defaults
          if [[ -n "${{ github.event.inputs.environment }}" ]]; then
            TEST_ENV="${{ github.event.inputs.environment }}"
          else
            TEST_ENV=$DEFAULT_ENV
          fi

          # Environment-specific overrides for services
          if [[ "${{ github.event.inputs.environment }}" != "" ]]; then
            EMMA_ENV="${{ github.event.inputs.environment }}"
            UMS_ENV="${{ github.event.inputs.environment }}"
            DMS_ENV="${{ github.event.inputs.environment }}"
            CRS_ENV="${{ github.event.inputs.environment }}"
          else
            EMMA_ENV=$EMMA_DEFAULT_ENV
            UMS_ENV=$UMS_DEFAULT_ENV
            DMS_ENV=$DMS_DEFAULT_ENV
            CRS_ENV=$CRS_DEFAULT_ENV
          fi

          echo "TEST_ENV=$TEST_ENV" >> $GITHUB_ENV
          echo "EMMA_ENV=$EMMA_ENV" >> $GITHUB_ENV
          echo "UMS_ENV=$UMS_ENV" >> $GITHUB_ENV
          echo "DMS_ENV=$DMS_ENV" >> $GITHUB_ENV
          echo "CRS_ENV=$CRS_ENV" >> $GITHUB_ENV

      - name: Run specified test cases
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          EMMA_ENV: ${{ env.EMMA_ENV }}
          UMS_ENV: ${{ env.UMS_ENV }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          TESTRAIL_USERNAME: ${{ secrets.TESTRAIL_USERNAME }}
          TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
        run: |
          TEST_CASES="${{ github.event.inputs.test_case || 'all' }}" # Default to 'all' if no input
          echo "Executing in environment: $TEST_ENV"
          echo "EMMA is running in environment: $EMMA_ENV"
          echo "User Management Service (UMS) is running in environment: $UMS_ENV"
          echo "Test case(s) input: $TEST_CASES"
          
          ERRORS=0

          if [ -z "$TEST_CASES" ] || [ "$TEST_CASES" = "all" ]; then
            echo "Running all tests..."
            node run-all-tests.js || ERRORS=$((ERRORS+1))
          else
            IFS=',' read -ra TEST_ARRAY <<< "$TEST_CASES" # Split by comma
            for TEST_CASE in "${TEST_ARRAY[@]}"; do
              TEST_CASE=$(echo "$TEST_CASE" | xargs) # Trim spaces
              if [ -f "testCases/$TEST_CASE.js" ]; then
                echo "Found file: testCases/$TEST_CASE.js"
                chmod +x testCases/$TEST_CASE.js
                echo "Executing test case $TEST_CASE..."
                node -e "require('./testCases/$TEST_CASE')();" || ERRORS=$((ERRORS+1))
                echo "Execution of $TEST_CASE.js completed with status $?"
              else
                echo "Test case not found: $TEST_CASE"
                ERRORS=$((ERRORS+1))
              fi
            done
          fi

          if [ $ERRORS -ne 0 ]; then
            echo "$ERRORS test(s) failed."
            exit 1
          else
            echo "All tests passed successfully."
          fi
