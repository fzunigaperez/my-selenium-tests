name: Run Selenium Tests on BrowserStack

on:
  workflow_dispatch:
    inputs:
      test_case:
        description: 'Nombre del test case a ejecutar (por ejemplo, C90)'
        required: false
        default: 'all'

  schedule:
    - cron: "00 20 * * *"

jobs:
  run-selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

            - name: Run specified test case or all tests
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          TEST_CASE: ${{ github.event.inputs.test_case }}
        run: |
          echo "Test case input: $TEST_CASE"
          if [ "$TEST_CASE" = "all" ]; then
            echo "Running all tests..."
            node run-all-tests.js
          elif [ -f "testCases/$TEST_CASE.js" ]; then
            echo "Running single test case: $TEST_CASE"
            node testCases/$TEST_CASE.js
          else
            echo "Test case not found: $TEST_CASE"
            exit 1
          fi
